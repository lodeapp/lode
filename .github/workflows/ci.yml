name: CI
on: [push, pull_request]
env:
  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  CI: true
  CSC_KEY_PASSWORD: ${{ secrets.MACOSDEVELOPERCERTIFICATE_PASSWORD }}
  CSC_LINK: ${{ secrets.MACOSDEVELOPERCERTIFICATE_BASE64 }}
  CSC_FOR_PULL_REQUEST: true
  CYPRESS_VERIFY_TIMEOUT: 100000
  FORCE_COLOR: 3
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Test and build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        os: [macOS-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: System info (macOS)
        if: matrix.os == 'macOS-latest'
        run: sw_vers

      - name: System info (Windows)
        if: matrix.os == 'windows-latest'
        run: systeminfo

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint styles
        run: npm run lint:styles

      - name: Lint scripts
        run: npm run lint -- --quiet

      - name: Check Typescript
        run: npm run tsc

      - name: Unit test
        run: npm test

      - name: Cypress test
        run: npm run test:cypress -- --record --key ${{ secrets.CYPRESS_RECORD_KEY }}

      - name: Save Cypress results
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: cypress-${{ matrix.os }}
          path: |
            tests/cypress/screenshots
            tests/cypress/videos

      - name: Build
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: build

  release:
    name: Release for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.ref == 'refs/heads/main'
    needs: test
    strategy:
      matrix:
        node-version: [20.x]
        os: [macOS-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npm run release
